<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2196F3">
  <meta name="description" content="Nhắc nhở uống nước thông minh">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <title>💧 Uống Nước</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(145deg, #e3f2fd 0%, #bbdefb 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(33, 150, 243, 0.2);
      text-align: center;
    }

    h1 {
      font-size: 28px;
      color: #1565C0;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .subtitle {
      color: #64B5F6;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* Water glass */
    .glass-container {
      position: relative;
      width: 120px;
      height: 160px;
      margin: 0 auto 20px;
      cursor: pointer;
    }

    .glass {
      width: 120px;
      height: 160px;
      border: 4px solid #90CAF9;
      border-radius: 0 0 20px 20px;
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,0.5);
      box-shadow: inset 0 0 10px rgba(33, 150, 243, 0.1);
    }

    .glass::after {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 8px;
      background: #90CAF9;
      border-radius: 4px 4px 0 0;
    }

    .water-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(180deg, #4FC3F7, #0288D1);
      transition: height 0.5s ease;
      border-radius: 0 0 16px 16px;
    }

    .water-fill::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 0;
      width: 100%;
      height: 8px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.2));
      border-radius: 50%;
    }

    /* Wave animation */
    .water-fill.has-water::after {
      content: '';
      position: absolute;
      top: -6px;
      left: -10%;
      width: 120%;
      height: 10px;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.3) 0%, transparent 70%);
      animation: wave 2s ease-in-out infinite;
    }

    @keyframes wave {
      0%, 100% { transform: translateX(-5%) scaleY(1); }
      50% { transform: translateX(5%) scaleY(0.6); }
    }

    .glass-label {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform: translate(-50%, 50%);
      font-size: 32px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 2;
    }

    /* Stats */
    .stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 20px 0;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
      color: #1565C0;
    }

    .stat-label {
      font-size: 12px;
      color: #90CAF9;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 20px 0;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .control-row label {
      font-size: 14px;
      color: #546E7A;
      font-weight: 500;
      white-space: nowrap;
    }

    select, input[type="number"] {
      padding: 10px 16px;
      border: 2px solid #E3F2FD;
      border-radius: 12px;
      font-size: 16px;
      background: #F5F9FF;
      color: #1565C0;
      font-weight: 600;
      flex: 1;
      max-width: 140px;
      text-align: center;
      -webkit-appearance: none;
      appearance: none;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #2196F3;
    }

    /* Buttons */
    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2196F3, #1565C0);
      color: white;
      box-shadow: 0 4px 16px rgba(33, 150, 243, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 24px rgba(33, 150, 243, 0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: white;
      box-shadow: 0 4px 16px rgba(76, 175, 80, 0.3);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef5350, #c62828);
      color: white;
      box-shadow: 0 4px 16px rgba(239, 83, 80, 0.3);
    }

    .btn-secondary {
      background: #E3F2FD;
      color: #1565C0;
    }

    .btn-full {
      width: 100%;
    }

    /* Add water quick buttons */
    .quick-add {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }

    .quick-add .btn {
      flex: 1;
      padding: 10px;
      font-size: 14px;
    }

    /* Status */
    .status-bar {
      background: #E3F2FD;
      border-radius: 12px;
      padding: 12px 16px;
      margin: 16px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      color: #1565C0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.on { background: #4CAF50; animation: pulse 1.5s infinite; }
    .status-dot.off { background: #B0BEC5; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* History */
    .history {
      margin-top: 16px;
      text-align: left;
    }

    .history h3 {
      font-size: 14px;
      color: #90CAF9;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .history-list {
      max-height: 120px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #E3F2FD;
      font-size: 13px;
      color: #546E7A;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 100;
      opacity: 0;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Install banner */
    .install-banner {
      background: linear-gradient(135deg, #1565C0, #0D47A1);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      margin: 12px 0;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .install-banner.show {
      display: flex;
    }

    .install-banner .btn {
      padding: 8px 20px;
      font-size: 13px;
      background: white;
      color: #1565C0;
    }

    /* Responsive */
    @media (max-width: 400px) {
      .container { padding: 20px 16px; }
      .stats { gap: 16px; }
      .stat-number { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💧 <span id="greeting">Uống Nước</span></h1>
    <p class="subtitle">Nhắc nhở uống nước thông minh</p>

    <!-- Water glass visual -->
    <div class="glass-container" onclick="addWater(250)" title="Nhấn để uống 250ml">
      <div class="glass">
        <div class="water-fill" id="waterFill" style="height: 0%"></div>
        <div class="glass-label" id="waterPercent">0%</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-item">
        <div class="stat-number" id="todayTotal">0</div>
        <div class="stat-label">Hôm nay (ml)</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="todayCups">0</div>
        <div class="stat-label">Ly đã uống</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="goalPercent">0%</div>
        <div class="stat-label">Mục tiêu</div>
      </div>
    </div>

    <!-- Quick add -->
    <div class="quick-add">
      <button class="btn btn-secondary" onclick="addWater(100)">🥤 100ml</button>
      <button class="btn btn-secondary" onclick="addWater(200)">🥛 200ml</button>
      <button class="btn btn-secondary" onclick="addWater(350)">🧃 350ml</button>
      <button class="btn btn-secondary" onclick="addWater(500)">🫗 500ml</button>
    </div>

    <!-- Settings -->
    <div class="controls">
      <div class="control-row">
        <label>🔔 Nhắc sau mỗi</label>
        <select id="reminderInterval">
          <option value="15">15 phút</option>
          <option value="30" selected>30 phút</option>
          <option value="45">45 phút</option>
          <option value="60">1 giờ</option>
          <option value="90">1.5 giờ</option>
          <option value="120">2 giờ</option>
        </select>
      </div>
      <div class="control-row">
        <label>🎯 Mục tiêu / ngày</label>
        <select id="dailyGoal">
          <option value="1000">1 lít</option>
          <option value="1500">1.5 lít</option>
          <option value="2000" selected>2 lít</option>
          <option value="2500">2.5 lít</option>
          <option value="3000">3 lít</option>
          <option value="4000">4 lít</option>
        </select>
      </div>
    </div>

    <!-- Status -->
    <div class="status-bar" id="statusBar">
      <span class="status-dot off" id="statusDot"></span>
      <span id="statusText">Bấm BẮT ĐẦU để nhận nhắc nhở</span>
    </div>

    <!-- Main buttons -->
    <div style="display:flex; gap:12px;">
      <button class="btn btn-success btn-full" id="startBtn" onclick="startReminders()">
        ✅ Bắt đầu
      </button>
      <button class="btn btn-danger btn-full" id="stopBtn" onclick="stopReminders()" style="display:none;">
        ⏹ Dừng
      </button>
    </div>

    <!-- Install banner -->
    <div class="install-banner" id="installBanner">
      <span>📲 Cài app lên màn hình chính để nhận thông báo tốt hơn!</span>
      <button class="btn" onclick="installApp()">Cài đặt</button>
    </div>

    <!-- History -->
    <div class="history" id="historySection" style="display:none;">
      <h3>📋 Lịch sử hôm nay</h3>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
